<title>ระบบไม่ส่งไฟออกทำงานไม่ได้: ตรวจ CT / มิเตอร์ ระบบ 3 เฟส (20 kWp) | Solar ESS</title><meta name="description" content="ระบบไม่ส่งไฟออกทำงานไม่ได้: ตรวจ CT / มิเตอร์ ระบบ 3 เฟส (20 kWp) – บ้านดู่ เมืองเชียงราย · แผนที่บริเวณ (โดยประมาณ) ↗ · 20 kWp ระบบ · 20 kW ไฮบริด 3 เฟส · ½ day ประมาณการ. โรงงานขนาดเล็ก ไม่มีแบตเตอรี่ ยังส่งไฟออกกริดในวันหยุดและค่าที่มิเตอร์อ่านได้กระโดด (±48 kW) แสดงว่าการต่อ CT หรือมิเตอร์ไม่ถูกต้อง เสนอค่างานแบบเหมาโครงการพร้อมงบประมาณค่าวัสดุโดยประมาณ (ดูด้านล่าง). ขอบเขตงาน: ตรวจตำแหน่ง CT/มิเตอร์ของแต่ละเฟส (L1–L3) ที่เมนเข้า แก้ทิศและลำดับเฟสให้ถูกต้อง; ตรวจสาย RS485 จากมิเตอร์ถึงอินเวอร์เตอร์และการตั้งค่ามิเตอร์; ยืนยันว่าโหลดทั้งหมดอยู่หลัง CT (รวมอาคารอื่น/เส้นทาง ATS);…"><meta name="robots" content="noindex,follow"><link rel="canonical" href="https://solaress.org/th/job.html#fix-ct-bandu-20">
