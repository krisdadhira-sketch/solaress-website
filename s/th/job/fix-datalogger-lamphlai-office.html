<title>ระบบติดตามออฟไลน์ + Wi-Fi อ่อน: แก้ไขดาต้าล็อกเกอร์ (8 kWp) | Solar ESS</title><meta name="description" content="ระบบติดตามออฟไลน์ + Wi-Fi อ่อน: แก้ไขดาต้าล็อกเกอร์ (8 kWp) – ลำไพล หาดใหญ่ สงขลา · แผนที่บริเวณ (โดยประมาณ) ↗ · 8 kWp ระบบ · 8 kW ไฮบริด 1 เฟส · 2–3 h ประมาณการ. ระบบของสำนักงาน ระบบติดตามออฟไลน์ตั้งแต่ 25 ต.ค. หลังหลุดบ่อยหลายครั้ง เชื่อมต่อดาต้าล็อกเกอร์ใหม่และแก้ไขสัญญาณ Wi-Fi เสนอค่างานแบบเหมาโครงการพร้อมงบประมาณค่าวัสดุโดยประมาณ (ดูด้านล่าง). ขอบเขตงาน: ตรวจว่าอินเวอร์เตอร์ทำงานอยู่ จดรหัสแจ้งเตือน; ตรวจไฟเลี้ยง/ไฟสถานะของดาต้าล็อกเกอร์และจับคู่กับเราเตอร์ใหม่; วัดสัญญาณ Wi-Fi ที่อินเวอร์เตอร์ ย้ายเราเตอร์หรือเพิ่มตัวขยายสัญญาณ/AP ภายนอก; ยืนยันว่าแอปแสดงข้อมูลเรียลไทม์อย่างเสถียร;…"><meta name="robots" content="noindex,follow"><link rel="canonical" href="https://solaress.org/th/job.html#fix-datalogger-lamphlai-office">
