<title>อินเวอร์เตอร์ตัดเพราะแรงดันกริดสูง: บันทึกแรงดันและตรวจสาย AC (10 kWp) | Solar ESS</title><meta name="description" content="อินเวอร์เตอร์ตัดเพราะแรงดันกริดสูง: บันทึกแรงดันและตรวจสาย AC (10 kWp) – ทุ่งยาว ปะเหลียน ตรัง · แผนที่บริเวณ (โดยประมาณ) ↗ · 10 kWp ระบบ · 10 kW ไฮบริด 1 เฟส · ½ day ประมาณการ. ฟาร์มที่มีแบตเตอรี่ อินเวอร์เตอร์ตัด 56 ครั้งในเดือนตุลาคมเพราะแรงดันกริดสูง (เห็นราว 245 V) วัดและบันทึกแรงดันเพื่อใช้ยื่นขอให้ กฟภ. ปรับ และตรวจสาย AC ว่ามีแรงดันตกคร่อมสูงหรือไม่ เสนอค่างานแบบเหมาโครงการพร้อมงบประมาณค่าวัสดุโดยประมาณ (ดูด้านล่าง). ขอบเขตงาน: วัดแรงดันที่มิเตอร์ กฟภ. และที่ขั้วอินเวอร์เตอร์ ช่วงเช้า/เที่ยง/เย็น; ตรวจขนาดสาย ระยะ และจุดต่อสาย AC ระหว่างมิเตอร์ ตู้ไฟ และอินเวอร์เตอร์ (แรงดันตกคร่อม);…"><meta name="robots" content="noindex,follow"><link rel="canonical" href="https://solaress.org/th/job.html#fix-voltage-thungyao-trang">
