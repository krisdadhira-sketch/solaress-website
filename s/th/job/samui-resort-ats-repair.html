<title>งานซ่อมไฟฟ้า: ตรวจสอบและซ่อม ATS 3 เฟส (ระบบโซลาร์ไฮบริด 20 kW + แบตเตอรี่) | Solar ESS</title><meta name="description" content="งานซ่อมไฟฟ้า: ตรวจสอบและซ่อม ATS 3 เฟส (ระบบโซลาร์ไฮบริด 20 kW + แบตเตอรี่) – บ่อผุด เกาะสมุย (รีสอร์ท) · แผนที่พื้นที่ (โดยประมาณ) ↗ · 20 kW อินเวอร์เตอร์ไฮบริด 3 เฟส + แบตเตอรี่ · ATS 3 เฟส ไฟการไฟฟ้า ↔ ไฟสำรองอินเวอร์เตอร์ · ~1 วัน หน้างาน รวมทดสอบ · ฿4,400 ค่าแรงโดยประมาณ ~1 วัน (ไม่รวมอะไหล่ จ่ายตามใบเสร็จ). เมื่อวันที่ 11 พ.ย. 2569 ATS สลับรีสอร์ทไปใช้ไฟสำรองจากอินเวอร์เตอร์ทั้งที่ไฟการไฟฟ้าปกติ และไม่สลับกลับ ปัจจุบันใช้ไฟการไฟฟ้าในโหมด Manual จึงไม่มีไฟสำรองอัตโนมัติจนกว่าจะซ่อมเสร็จ. ขอบเขตงาน: ตัดไฟและล็อก (LOTO) ทั้ง 2 แหล่งจ่าย ถ่ายรูปตู้ ATS ป้ายพิกัด และการเดินสาย;…"><meta name="robots" content="noindex,follow"><link rel="canonical" href="https://solaress.org/th/job.html#samui-resort-ats-repair">
